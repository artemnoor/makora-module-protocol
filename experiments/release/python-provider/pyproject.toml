[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mmp-independent-python-provider"
version = "1.0.0"
description = "Independent read-only MMP 0.1.0 provider implemented with the official Python MCP SDK."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "jsonschema>=4.23,<5",
]

[project.scripts]
mmp-independent-python = "mmp_independent_python.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp_independent_python"]
