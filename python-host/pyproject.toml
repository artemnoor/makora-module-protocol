[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmp-reference-host"
version = "0.1.0"
description = "Independent Python host for MMP 0.1 over MCP"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "jsonschema==4.25.1",
  "uvicorn==0.38.0",
]

[tool.setuptools]
packages = ["mmp_host"]

[tool.setuptools.package-data]
mmp_host = ["schemas/*.json"]

[tool.ruff.lint.per-file-ignores]
# Validation and admission guards keep their human-readable messages at the raise site.
"mmp_host/host.py" = ["TRY003", "TRY301"]
"tests/**/*.py" = ["TRY003", "TRY301"]
