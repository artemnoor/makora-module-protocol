name: Verify MMP draft

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            spike/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --python 3.12
      - run: npm ci
      - run: npm run verify:release
      - if: runner.os == 'Linux'
        run: npm run verify:external
      - run: node examples/demo.mjs
      - run: npm ci
        working-directory: spike
      - run: uv sync --locked --python 3.12
        working-directory: spike
      - run: npm run check
        working-directory: spike
      - run: uv sync --locked --project python-host --python 3.12
      - run: npm run verify:hosts
      - if: runner.os == 'Linux'
        run: npm run verify:external:hosts

  universality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --python 3.12
      - run: uv sync --locked --python 3.12
        working-directory: demos/universality/third-party
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:universality
