[project]
name = "mmp-independent-decorator"
version = "1.0.0"
description = "Independent Python MCP module for the MMP universality demo"
requires-python = ">=3.11"
dependencies = [
    "anyio==4.16.0",
    "jsonschema==4.25.1",
    "mcp==2.3.0",
]

[project.scripts]
mmp-independent-decorator = "mmp_independent_decorator.server:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp_independent_decorator"]
